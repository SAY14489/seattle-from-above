store:
  url: "s3://olmoearth/olmoearth-v1-3-embeddings/embeddings.zarr"
  endpoint: "https://data.source.coop"

# Test box: Greater Seattle metro (Puget Sound corridor), WA.
# Roughly Everett to Tacoma north-south, Puget Sound to the Cascade foothills
# (North Bend/Issaquah) east-west -- covers Seattle, Bellevue, Redmond,
# Tacoma, Everett, and the eastside tech corridor.
region:
  name: seattle_metro
  center_lon: -122.25
  center_lat: 47.55
  width_km: 72.0    # east-west: Puget Sound to the Cascade foothills
  height_km: 120.0  # north-south: Tacoma to Everett

years:
  a: 2017   # "before"
  b: 2025   # "after"
  c: 2021   # middle year, for persistence filtering (M2)

processing:
  tile_px: 800      # streamed read tile size (8km x 8km), must be a multiple of cell_px
  cell_px: 100      # aggregation cell size (1km x 1km)
  bands: 64         # use the 64-dim matryoshka embedding subset (faster, still accurate)

sites:
  change_percentile_threshold: 90.0   # v1 self-referential threshold; M2 replaces with local z-score
  min_area_km2: 0.25
  min_pixels: 25     # redundant safety floor on top of min_area_km2

paths:
  data_dir: "../data/seattle"
